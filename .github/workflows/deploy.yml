name: Deploy AMURA Engine 4 to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: amura-engine-4-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: amura-engine-4
      PROD_URL: https://amura-engine-4.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read revision
        id: revision
        shell: bash
        run: |
          REVISION=$(grep -oE 'ENGINE 4 · R[0-9]+\.[0-9]+' index.html | head -n 1 | sed 's/ENGINE 4 · //')
          [ -n "$REVISION" ] || { echo 'Revision not found in index.html'; exit 1; }
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Deploying $REVISION"

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p dist
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=amura-engine-4 --branch=main

      - name: Verify production revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          for attempt in $(seq 1 30); do
            BODY=$(curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/?verify=$GITHUB_SHA-$attempt" || true)
            if printf '%s' "$BODY" | grep -Fq "ENGINE 4 · $EXPECTED_REVISION"; then
              echo "Production verified: $EXPECTED_REVISION"
              exit 0
            fi
            echo "Waiting for production: attempt $attempt"
            sleep 5
          done
          echo "Production did not expose $EXPECTED_REVISION"
          exit 1

      - name: Delete old Cloudflare Pages deployments
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sleep 3
          PROJECT_JSON=$(curl -fsS "$API" -H "$AUTH")
          ACTIVE=$(printf '%s' "$PROJECT_JSON" | jq -r '.result.latest_deployment.id // empty')
          [ -n "$ACTIVE" ] || { echo 'No active deployment id'; exit 1; }
          for round in $(seq 1 30); do
            JSON=$(curl -fsS "$API/deployments" -H "$AUTH")
            TOTAL=$(printf '%s' "$JSON" | jq -r '.result_info.total_count // (.result|length)')
            echo "Cloudflare deployments: $TOTAL"
            [ "$TOTAL" -le 1 ] && exit 0
            while read -r ID; do
              [ -z "$ID" ] && continue
              [ "$ID" = "$ACTIVE" ] && continue
              curl -fsS -X DELETE "$API/deployments/$ID?force=true" -H "$AUTH" >/dev/null
            done < <(printf '%s' "$JSON" | jq -r '.result[].id')
            sleep 1
          done
          FINAL=$(curl -fsS "$API/deployments" -H "$AUTH")
          FINAL_TOTAL=$(printf '%s' "$FINAL" | jq -r '.result_info.total_count // (.result|length)')
          [ "$FINAL_TOTAL" -eq 1 ] || { echo "Cleanup incomplete: $FINAL_TOTAL deployments remain"; exit 1; }
